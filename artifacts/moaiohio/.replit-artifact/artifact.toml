kind = "web"
previewPath = "/"
title = "moaiohio"
version = "1.0.0"
id = "artifacts/moaiohio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24833

[services.development]
run = "pnpm --filter @workspace/moaiohio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moaiohio", "run", "build" ]
publicDir = "artifacts/moaiohio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24833"
BASE_PATH = "/"
